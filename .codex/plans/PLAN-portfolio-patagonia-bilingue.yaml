schema_version: 2
feature: "Rediseño bilingüe del portfolio con identidad Patagonia digital y flujo de desarrollo con IA"
created: "2026-09-15"
status: done
resumen_humano:
  que_se_va_a_cambiar: "El portfolio presentará a Lucas como Backend Developer mediante una portada personal, proyectos en formato de casos de estudio, stack organizado, proceso de trabajo con IA y contenido completo en español e inglés."
  que_podria_fallar:
    - "Que el texto pierda legibilidad sobre la fotografía panorámica en pantallas pequeñas."
    - "Que queden fragmentos sin traducir al alternar entre ES y EN."
    - "Que enlaces o imágenes externas de certificados dejen espacios vacíos."
project:
  type: "GitHub Pages estático"
  stack:
    - "HTML5"
    - "CSS3"
    - "JavaScript sin framework"
    - "CSS propio sin framework ni proceso de build"
    - "Google Fonts"
out_of_scope:
  - "Modificar repositorios de proyectos enlazados o el perfil público de GitHub."
  - "Inventar métricas, empleadores, resultados comerciales o certificaciones no demostradas."
  - "Agregar backend, formulario con persistencia, analítica o servicio de traducción externo."
  - "Instalar paquetes o introducir un proceso de build."
acceptance_criteria:
  - id: AC1
    given: "Una visita nueva al portfolio"
    when: "La página termina de cargar"
    then: "El contenido aparece en español y el hero comunica nombre, rol, propuesta de valor, acceso a proyectos y descarga de CV."
  - id: AC2
    given: "La página está en cualquier idioma"
    when: "La persona activa el selector ES/EN"
    then: "Todo el contenido visible, los textos accesibles y los metadatos relevantes cambian al idioma elegido sin recargar la página."
  - id: AC3
    given: "La persona seleccionó inglés o español"
    when: "Recarga la página en el mismo navegador"
    then: "La preferencia de idioma se conserva localmente; español sigue siendo el valor inicial cuando no existe preferencia."
  - id: AC4
    given: "Una persona revisa el sitio desde móvil, tablet o escritorio"
    when: "Navega por las secciones y controles"
    then: "El layout mantiene contraste, jerarquía, foco visible, navegación por teclado y ausencia de desbordes horizontales."
  - id: AC5
    given: "Una persona revisa los proyectos destacados"
    when: "Lee una tarjeta"
    then: "Encuentra contexto, aporte técnico, tecnologías y un enlace válido cuando el proyecto es público, sin enlaces vacíos."
  - id: AC6
    given: "Una persona revisa el stack profesional"
    when: "Llega a la sección de herramientas y proceso"
    then: "Distingue backend, frontend/datos/infraestructura y el flujo con Claude Code, MCP, skills, agentes, planificación automática, tests y revisión."
  - id: AC7
    given: "El navegador tiene JavaScript deshabilitado o una imagen no carga"
    when: "Se renderiza el documento"
    then: "El contenido principal continúa legible y las imágenes poseen alternativas textuales útiles."
phases:
  - id: 1
    name: "Sistema visual Patagonia digital"
    status: done
    depends_on: []
    tasks:
      - id: "1.1"
        description: "Reestructurar la página con una jerarquía orientada a reclutadores y desarrolladores."
        status: done
        files:
          - "index.html"
        action: "Reemplazar el listado actual por navegación, hero, presentación breve, proyectos destacados, stack, flujo IA, formación y contacto; reutilizar las fotografías y capturas existentes."
        criteria: [AC1, AC5, AC6, AC7]
        acceptance: "El primer viewport explica quién es Lucas y los proyectos y capacidades principales pueden identificarse sin recorrer una grilla extensa de certificados."
        rollback: "Restaurar únicamente la estructura nueva de index.html desde el diff, preservando recursos existentes."
        evidence:
          - "index.html actual concentra todo el contenido y comportamiento del sitio."
          - "Hero, casos de estudio, stack, flujo IA, formación y contacto renderizados en capturas locales de escritorio y móvil."
      - id: "1.2"
        description: "Construir el diseño visual responsive y accesible."
        status: done
        files:
          - "assets/css/base.css"
        action: "Crear tokens de color azul profundo, glaciar, piedra y bordó; configurar DM Sans y Lora; diseñar tarjetas, navegación, hero fotográfico, botones, estados de foco, breakpoints y preferencias de movimiento reducido."
        criteria: [AC1, AC4, AC7]
        acceptance: "La identidad Patagonia digital es consistente y legible entre 320 px y escritorio, con foco visible y contraste suficiente."
        rollback: "Revertir assets/css/base.css sin eliminar imágenes ni documentos existentes."
        evidence:
          - "assets/css/base.css existe pero no está enlazado por el HTML actual."
          - "Chrome headless verificó 1440 px y emulación móvil real de 390 px sin desborde horizontal."
    gate: "La estructura y el sistema visual cubren el contenido acordado sin agregar dependencias."
  - id: 2
    name: "Contenido bilingüe y comportamiento"
    status: done
    depends_on: [1]
    tasks:
      - id: "2.1"
        description: "Incorporar traducciones completas ES/EN y selector de idioma."
        status: done
        files:
          - "index.html"
        action: "Definir textos equivalentes mediante atributos de traducción y JavaScript local; actualizar lang, title, descripción, aria-labels y estado activo del selector."
        criteria: [AC2, AC3, AC7]
        acceptance: "El selector cambia todo el contenido previsto, guarda la preferencia y mantiene español como idioma inicial."
        rollback: "Eliminar el script y atributos de internacionalización, dejando el contenido español estático."
        evidence:
          - "79 claves traducibles tienen valores ES/EN; el cambio actualiza lang, metadatos y contenido, y persiste inglés tras recargar."
      - id: "2.2"
        description: "Completar interacciones de navegación sin dependencias."
        status: done
        files:
          - "index.html"
        action: "Implementar menú móvil accesible, cierre al navegar o presionar Escape, año dinámico y mejora progresiva de controles."
        criteria: [AC4, AC7]
        acceptance: "Los controles funcionan con puntero y teclado, exponen su estado y no bloquean el contenido si JavaScript falla."
        rollback: "Retirar el comportamiento JavaScript conservando enlaces ancla funcionales."
        evidence:
          - "Prueba CDP a 390 px confirmó apertura del menú, cierre con Escape y devolución del foco al botón."
    gate: "ES y EN cubren el mismo contenido y las interacciones tienen alternativa funcional."
  - id: 3
    name: "Verificación integral"
    status: done
    depends_on: [2]
    tasks:
      - id: "3.1"
        description: "Validar estructura, enlaces internos, recursos y traducciones."
        status: done
        files:
          - "index.html"
          - "assets/css/base.css"
        action: "Ejecutar verificaciones locales disponibles, revisar referencias a archivos, IDs únicos, destinos vacíos, claves bilingües y ausencia de errores JavaScript."
        criteria: [AC1, AC2, AC3, AC5, AC6, AC7]
        acceptance: "No hay rutas locales rotas, href vacíos, IDs duplicados ni claves de traducción sin equivalente."
        rollback: "Corregir únicamente el defecto identificado, sin ampliar el alcance."
        evidence:
          - "Checker Node confirmó un script válido, 17 IDs únicos, 79 claves traducibles y 8 referencias locales existentes."
          - "git diff --check finalizó sin errores de whitespace."
      - id: "3.2"
        description: "Verificar visualmente responsive, teclado y reducción de movimiento."
        status: done
        files:
          - "index.html"
          - "assets/css/base.css"
        action: "Servir el sitio localmente y revisar al menos vista móvil y escritorio, flujo ES/EN, menú, foco, contraste y prefers-reduced-motion."
        criteria: [AC2, AC3, AC4]
        acceptance: "Las vistas principales son utilizables, no desbordan y permiten completar navegación, cambio de idioma, acceso a proyectos y descarga de CV."
        rollback: "Ajustar solo estilos o interacción causantes de la regresión."
        evidence:
          - "Capturas locales revisadas en escritorio y móvil; emulación CDP confirmó viewport de 390 px sin overflow."
    gate: "El gate de calidad devuelve APPROVED o todos los hallazgos bloqueantes quedan corregidos."
validation:
  checks:
    - command: "git diff --check"
      cwd: "."
      required: true
      expected_result: "Sin errores de whitespace."
    - command: "python -m http.server 8000"
      cwd: "."
      required: false
      expected_result: "El sitio puede abrirse localmente para la revisión visual."
  tests_to_run: "Validación estática del HTML/CSS/JS y revisión visual responsive del sitio servido localmente."
  required_checks:
    - "Todos los archivos locales referenciados existen."
    - "No quedan enlaces href vacíos ni destinos '#'."
    - "Cada clave traducible tiene contenido ES y EN."
    - "El selector conserva el idioma y actualiza html[lang]."
    - "El menú y el selector funcionan con teclado."
risks:
  - "La fotografía panorámica tiene zonas de contraste variable; el overlay debe proteger la lectura sin ocultar el paisaje."
  - "El sitio depende actualmente de recursos remotos; reducirlos mejora confiabilidad, pero Google Fonts seguirá necesitando red salvo que se incorporen archivos locales."
  - "Los proyectos privados o sin URL pública no deben presentar llamadas a la acción engañosas."
decisions_pending: []
